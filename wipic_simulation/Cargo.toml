[package]
name = "wipic_simulation"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(not(target_os = "none"))'.dependencies]
wipi_types = { workspace = true, features = ["simulation"] }
once_cell = "1.21"
png = "0.17"
winit = "0.30"
softbuffer = "0.4"
ab_glyph = "0.2"
font-kit = "0.14"
rodio = { version = "^0.21", features = ["playback"] }
midir = { version = "^0.10" }
smaf = { git = "https://github.com/dlunch/smaf.git" }
smaf_player = { git = "https://github.com/dlunch/smaf.git" }
