[package]
name = "wipi"
description = "Rust library for developing WIPI applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
ktf = ["wipi-types/ktf", "wipi-boot/ktf", "wipic-sys/ktf"]
lgt = ["wipi-types/lgt", "wipi-boot/lgt", "wipic-sys/lgt"]
simulation = ["wipi-types/simulation", "wipi-boot/simulation", "wipic-sys/simulation"]

[dependencies]
wipi-boot = { workspace = true, optional = true }
wipi-macros = { workspace = true }
wipi-types = { workspace = true, optional = true }
wipic-sys = { workspace = true }
