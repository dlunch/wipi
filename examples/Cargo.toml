[package]
name = "examples"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["simulation"]
ktf = ["wipi/ktf", "wipi-build/ktf"]
lgt = ["wipi/lgt", "wipi-build/lgt"]
simulation = ["wipi/simulation"]

[dependencies]
wipi = { workspace = true }

[build-dependencies]
wipi-build = { workspace = true }

[[bin]]
name = "helloworld"
path = "src/helloworld.rs"

[[bin]]
name = "paint"
path = "src/paint.rs"

[[bin]]
name = "input"
path = "src/input.rs"

[[bin]]
name = "resource"
path = "src/resource.rs"

[[bin]]
name = "image"
path = "src/image.rs"

[[bin]]
name = "timer"
path = "src/timer.rs"

[[bin]]
name = "audio"
path = "src/audio.rs"
