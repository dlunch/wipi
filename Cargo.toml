[workspace]
resolver = "3"

members = ["examples", "wipi", "wipi-archiver", "wipi-boot", "wipi-build", "wipi-macros", "wipi-types", "wipic-simulation", "wipic-sys"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/dlunch/wipi"

[workspace.dependencies]
cfg-if = { version = "^1.0", default-features = false }

wipi = { path = "wipi" }
wipi-boot = { path = "wipi-boot" }
wipi-build = { path = "wipi-build" }
wipi-macros = { path = "wipi-macros" }
wipi-types = { path = "wipi-types" }
wipic-sys = { path = "wipic-sys" }

wipic-simulation = { path = "wipic-simulation" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.examples]
inherits = "dev"
debug = false
